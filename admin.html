<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE | Admin Central</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffae00; --bg: #000; --card: #0d0d0d; --border: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* Login Screen */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { background: var(--card); border: 1px solid var(--border); padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        .auth-box h1 { font-family: 'Bebas Neue'; font-size: 2.5rem; margin-bottom: 30px; }
        .auth-box span { color: var(--accent); }

        /* Dashboard */
        #dashboard { display: none; padding: 30px 5%; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 30px; }
        .logo { font-family: 'Bebas Neue'; font-size: 2rem; }
        .btn-logout { background: #ff4444; border: none; color: #fff; padding: 10px 15px; cursor: pointer; font-family: 'Oswald'; }

        /* Layout Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .panel { background: var(--card); border: 1px solid var(--border); padding: 25px; }
        h2 { font-family: 'Oswald'; font-size: 1.2rem; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; border-left: 3px solid var(--accent); padding-left: 10px; }

        /* Input & Table */
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.7rem; color: #666; margin-bottom: 5px; }
        input, select, textarea { width: 100%; background: #050505; border: 1px solid #222; padding: 12px; color: #fff; }
        .btn-main { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Order Table */
        .order-container { margin-top: 40px; background: var(--card); border: 1px solid var(--border); padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { background: #111; color: var(--accent); text-align: left; padding: 12px; font-family: 'Oswald'; }
        td { padding: 12px; border-bottom: 1px solid #1a1a1a; }
        .status-badge { background: #ffae0022; color: var(--accent); padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1 id="atitle">FORGE<span>LOGIN</span></h1>
            <div class="form-group"><label>Username</label><input type="text" id="auser"></div>
            <div class="form-group"><label>Password</label><input type="password" id="apass"></div>
            <button class="btn-main" id="abtn" onclick="handleAuth()">SIGN IN</button>
            <span style="margin-top:20px; display:block; cursor:pointer; font-size:0.8rem;" onclick="toggleAuth()">Akun baru? <b style="color:var(--accent)">SIGN UP</b></span>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <div class="logo">FORGE<span>CENTRAL</span></div>
            <button class="btn-logout" onclick="logout()">LOGOUT</button>
        </header>

        <div class="grid">
            <div class="panel">
                <h2>Tambah Produk / Coaching</h2>
                <div class="form-group"><label>Nama Item</label><input type="text" id="pNama"></div>
                <div class="form-group"><label>Harga (Angka)</label><input type="number" id="pHarga"></div>
                <div class="form-group"><label>Kategori</label>
                    <select id="pKategori">
                        <option value="Access Pass">Access Pass</option>
                        <option value="Elite Coaching">Elite Coaching</option>
                    </select>
                </div>
                <div class="form-group"><label>Link Foto</label><input type="text" id="pImg"></div>
                <div class="form-group"><label>Deskripsi</label><textarea id="pDesc"></textarea></div>
                <button class="btn-main" onclick="saveData('addProduct')">PUBLISH PRODUCT</button>
            </div>

            <div class="panel">
                <h2>Tambah Gallery</h2>
                <div class="form-group"><label>Link Foto</label><input type="text" id="gImg"></div>
                <div class="form-group"><label>Label</label><input type="text" id="gDesc"></div>
                <button class="btn-main" style="background:#fff" onclick="saveData('addGallery')">UPLOAD PHOTO</button>
            </div>
        </div>

        <div class="order-container">
            <h2>Data Pesanan Masuk</h2>
            <table>
                <thead>
                    <tr>
                        <th>TANGGAL</th>
                        <th>CUSTOMER</th>
                        <th>WA</th>
                        <th>ITEM</th>
                        <th>TOTAL</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="order-list">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const GS_URL = "https://script.google.com/macros/s/AKfycbzFt4iRTwDzKemtooTlB6Mm7ZuOOBSwMibbgXZodzDnG-6FjD2UT4KBzhxet8UBUTzCvw/exec"; // GANTI!!
        let isSignup = false;

        window.onload = () => { if(localStorage.getItem("forge_ses")) showDash(); };

        function toggleAuth() {
            isSignup = !isSignup;
            document.getElementById('atitle').innerHTML = isSignup ? "FORGE<span>SIGNUP</span>" : "FORGE<span>LOGIN</span>";
            document.getElementById('abtn').innerText = isSignup ? "BUAT AKUN" : "SIGN IN";
        }

        async function handleAuth() {
            const user = document.getElementById('auser').value;
            const pass = document.getElementById('apass').value;
            const action = isSignup ? "registerAdmin" : "loginAdmin";
            const res = await fetch(GS_URL, {method:"POST", body:JSON.stringify({action, username:user, password:pass})});
            const out = await res.json();
            if(out.status === "success") { localStorage.setItem("forge_ses", user); showDash(); }
            else { alert("Gagal Login/Daftar (Quota Full atau Salah)"); }
        }

        function showDash() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadOrders();
        }

        async function saveData(action) {
            const data = action === 'addProduct' ? {
                action, nama: document.getElementById('pNama').value, harga: document.getElementById('pHarga').value,
                kategori: document.getElementById('pKategori').value, img: document.getElementById('pImg').value, desc: document.getElementById('pDesc').value
            } : { action, img: document.getElementById('gImg').value, desc: document.getElementById('gDesc').value };

            const res = await fetch(GS_URL, {method:"POST", body:JSON.stringify(data)});
            const out = await res.json();
            if(out.status === "success") { alert("Berhasil!"); location.reload(); }
        }

        async function loadOrders() {
            const res = await fetch(GS_URL + "?action=getOrders");
            const orders = await res.json();
            const list = document.getElementById('order-list');
            list.innerHTML = orders.reverse().map(o => `
                <tr>
                    <td>${o.tanggal}</td>
                    <td><b>${o.nama_customer}</b></td>
                    <td><a href="https://wa.me/${o.whatsapp}" target="_blank" style="color:var(--accent)">${o.whatsapp}</a></td>
                    <td>${o.item}</td>
                    <td>Rp ${parseInt(o.total_harga).toLocaleString()}</td>
                    <td><span class="status-badge">${o.status}</span></td>
                </tr>
            `).join('');
        }

        function logout() { localStorage.removeItem("forge_ses"); location.reload(); }
    </script>
</body>
</html>
